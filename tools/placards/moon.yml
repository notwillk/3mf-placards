$schema: "https://moonrepo.dev/schemas/project.json"
language: "python"

tasks:
  format:
    script: "shfmt -w scripts/*.sh"
  check:
    script: "shellcheck scripts/*.sh && python3 -m py_compile scripts/placards.py && ./scripts/placards.sh validate"
  list:
    command: "./scripts/placards.sh"
    args: ["list"]
    options:
      mergeArgs: "replace"
  validate:
    command: "./scripts/placards.sh"
    args: ["validate"]
    options:
      mergeArgs: "replace"
  build:
    command: "./scripts/placards.sh"
    args: ["build"]
    options:
      mergeArgs: "replace"
    inputs:
      - "moon.yml"
      - "scripts/**/*"
      - "/placards/registry/**/*"
      - "/models/placard-title-description/model.scad"
      - "/models/placard-title-description/scripts/**/*"
      - "/models/substrate/model.scad"
      - "/pyproject.toml"
      - "/uv.lock"
    outputs:
      - "/dist/placards/**"
  verify:
    deps:
      - "build"
    script: "checksy --config verify.checksy.yaml check"
  package:
    deps:
      - "build"
    command: "./scripts/placards.sh"
    args: ["package"]
    options:
      mergeArgs: "replace"
    inputs:
      - "moon.yml"
      - "scripts/**/*"
      - "/placards/registry/**/*"
      - "/models/placard-title-description/model.scad"
      - "/models/placard-title-description/scripts/**/*"
      - "/models/substrate/model.scad"
      - "/pyproject.toml"
      - "/uv.lock"
    outputs:
      - "/dist/placards/**"
  clean:
    command: "./scripts/placards.sh"
    args: ["clean"]
    options:
      mergeArgs: "replace"
