$schema: "https://moonrepo.dev/schemas/project.json"
language: "bash"

tasks:
  format:
    script: "shfmt -w scripts/*.sh"
  check:
    script: "shellcheck scripts/*.sh"
  build:
    script: "./scripts/build.sh"
    inputs:
      - "moon.yml"
      - "values.yaml"
      - "scripts/**/*"
      - "/tools/placards/scripts/**/*"
      - "/models/placard-title-description/model.scad"
      - "/models/placard-title-description/scripts/**/*"
      - "/models/substrate/model.scad"
      - "/pyproject.toml"
      - "/uv.lock"
    outputs:
      - "dist/**"
  verify:
    deps:
      - "build"
    script: "checksy --config verify.checksy.yaml check"
  package:
    deps:
      - "build"
    script: "./scripts/package.sh"
    inputs:
      - "moon.yml"
      - "values.yaml"
      - "scripts/**/*"
      - "/tools/placards/scripts/**/*"
      - "/models/placard-title-description/model.scad"
      - "/models/placard-title-description/scripts/**/*"
      - "/models/substrate/model.scad"
      - "/pyproject.toml"
      - "/uv.lock"
    outputs:
      - "dist/**"
  clean:
    script: "rm -rf dist"
