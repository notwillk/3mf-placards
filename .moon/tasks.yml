$schema: "https://moonrepo.dev/schemas/tasks.json"

tasks:
  install:
    command: "tools/workspace/scripts/install.sh"
    options:
      runFromWorkspaceRoot: true
  format:
    command: "moon"
    args: ["run", "*:format"]
  check:
    command: "moon"
    args: ["run", "*:check"]
  build:
    command: "moon"
    args: ["run", "*:build"]
  verify:
    command: "moon"
    args: ["run", "*:verify"]
  package:
    command: "moon"
    args: ["run", "*:package"]
  clean:
    command: "moon"
    args: ["run", "*:clean"]
  deep-clean:
    command: "tools/workspace/scripts/deep-clean.sh"
    options:
      runFromWorkspaceRoot: true
